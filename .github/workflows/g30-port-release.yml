name: G30 compatibility build and release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g30-port-release.yml"
      - "tools/port_g30.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"

      - name: Apply G30 SHU compatibility port
        run: python3 tools/port_g30.py

      - name: Commit generated source changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools
          if ! git diff --cached --quiet; then
            git commit -m "Add Ninebot G30 SHU BLE support"
            git push origin HEAD:main
          fi

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/G30-Rokid-HUD-v1.3.1-g30.1.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.1-g30.1"
          APK="release/G30-Rokid-HUD-v1.3.1-g30.1.apk"
          TARGET="$(git rev-parse HEAD)"
          NOTES=$(cat <<'EOF'
          G30 compatibility fork build.

          Changes:
          - Detects classic Ninebot/Segway G30 BLE advertisements (NBScooter/Ninebot/Segway + Nordic UART).
          - Uses the ScooterHacking Utility 2.7 compatible Ninebot UART/SHU encrypted handshake for G30.
          - Keeps the original Xiaomi M365 FE95 registration/token login path for M365 devices.
          - Reuses the known-good G30 crypto/auth behavior from Bl0ck154/Ninebot-scooter-blocker.
          - Keeps telemetry, lock/unlock and HUD data flow on the existing app UI.

          Pairing note: if the app asks, press the scooter POWER button once during authentication.

          This APK is a debug-signed compatibility build intended for direct testing on the G30.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$TARGET" \
              --title "G30 Rokid HUD v1.3.1-g30.1" \
              --notes "$NOTES"
          fi
