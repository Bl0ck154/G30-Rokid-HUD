name: G30 protocol PR validation

on:
  push:
    branches:
      - contrib/g30-crypto-telemetry-upstream-20261028
  pull_request:
    branches:
      - contrib/upstream-main-base-20261028

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Rust + Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup target add --toolchain stable aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "$SDK"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
      - name: Kotlin/JVM unit tests and Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
